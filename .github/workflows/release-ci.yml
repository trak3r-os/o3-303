# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release CI: runs only when a release tag (v*) is pushed, or by hand from the Actions tab. It builds this repository against the o3-sdk
# commit pinned in tools/o3sdk.ref and runs tools/ci.sh, the same script used on a developer's machine and on the remote build machine:
#   host  the host build and the full ctest suite
#   mk66  the cross build, the image's static checks and the software-double check
# It produces no image and attaches nothing to the release: a candidate image goes through fw-gate-check and the maintainer.
#
# o3-sdk is public; if it ever turns private, add a repository secret O3SDK_TOKEN with read access to trak3r-os/o3-sdk.
# Before tagging, tools/o3sdk.ref must name the o3-sdk commit the release builds against (pushed to trak3r-os/o3-sdk).
name: release-ci

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_GNU_VERSION: 15.3.rel1
  ARM_GNU_NAME: arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi
  # The same archive and SHA-256 as track3r-os's tools/ci.sh.
  ARM_GNU_SHA256: 563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa

jobs:
  ci:
    name: ci (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [host, mk66]
    steps:
      - name: Check out o3-303
        uses: actions/checkout@v4
        with:
          path: o3-303

      - name: Read the pinned o3-sdk commit
        id: sdk
        run: |
          ref=$(tr -d '[:space:]' < o3-303/tools/o3sdk.ref)
          case "$ref" in *[!0-9a-f]*|"") echo "tools/o3sdk.ref must hold a commit hash" >&2; exit 1 ;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out o3-sdk at that commit
        uses: actions/checkout@v4
        with:
          repository: trak3r-os/o3-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: o3-sdk
          token: ${{ secrets.O3SDK_TOKEN || github.token }}

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ python3 ccache

      - name: Cache the Arm toolchain
        if: matrix.mode == 'mk66'
        id: armcache
        uses: actions/cache@v4
        with:
          path: ~/arm/${{ env.ARM_GNU_NAME }}
          key: ${{ env.ARM_GNU_NAME }}-${{ env.ARM_GNU_SHA256 }}

      - name: Fetch the Arm toolchain and check its SHA-256
        if: matrix.mode == 'mk66' && steps.armcache.outputs.cache-hit != 'true'
        run: |
          url="https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/$ARM_GNU_VERSION/$ARM_GNU_NAME.tar.xz"
          mkdir -p ~/arm && cd ~/arm
          curl --proto '=https' --fail --location --silent --show-error --retry 3 --retry-delay 5 --output "$ARM_GNU_NAME.tar.xz" "$url"
          echo "$ARM_GNU_SHA256  $ARM_GNU_NAME.tar.xz" | sha256sum --check --strict -
          tar -xf "$ARM_GNU_NAME.tar.xz"
          rm "$ARM_GNU_NAME.tar.xz"

      - name: tools/ci.sh ${{ matrix.mode }}
        working-directory: o3-303
        env:
          O3SDK_DIR: ${{ github.workspace }}/o3-sdk
          O3SDK_CI_JOBS: 4
          O3SDK_CI_NICE: 0
        run: |
          export ARM_GNU_ROOT="$HOME/arm/$ARM_GNU_NAME"
          tools/ci.sh ${{ matrix.mode }}
